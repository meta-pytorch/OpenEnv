# prime-rl GRPO config used for the training run documented in
# envs/sophistry_bench_sprint_env/README.md ("Training" section).
#
# `env.id` is the verifiers/Prime Intellect Hub registration of the same
# sophistry-bench-sprint scoring this OpenEnv port wraps (parity-tested in
# tests/envs/test_sophistry_bench_sprint_environment.py), so the reward curves
# below are directly comparable to what you'd see training against this
# OpenEnv environment with the default SPRINT_WEIGHTS (aggregate_reward only).
#
# Submitted as a hosted GRPO run via Prime Intellect's Reinforcement Fine-Tuning
# product (https://docs.primeintellect.ai/reinforcement-fine-tuning); the env
# is registered with `prime env push` from the same scoring package this
# OpenEnv port wraps. Exact invocation depends on whether you run it through
# the dashboard or self-hosted prime-rl (https://github.com/PrimeIntellect-ai/prime-rl) --
# this file documents the config values, not a literal CLI command.

model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100

batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 512

[[env]]
id = "anusha/sophistry-bench-sprint"
