name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@6dd1bdab58a8564730f633d70e76bb1ef57ec627  # main
    with:
      commit_sha: ${{ github.sha }}
      package: openenv
      version_tag_suffix: ""
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
